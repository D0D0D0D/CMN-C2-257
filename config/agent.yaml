# Agent Manifest - AgentRegistry entry point
# AgentRegistry reads every key below at ROOT level; do not nest under `agent:`.
id: "CMN-C2-257"
name: "Enterprise Sales Proposal Draft Generation Agent"
namespace: "cmn"
version: "1.0.0"
enabled: true
category: "Cat 2"
