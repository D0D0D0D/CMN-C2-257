# Runtime parameters - loaded by AgentRegistry and passed as Graph(config=...).

max_retry: 3
timeout_seconds: 60

# Shared sales RAG (Data Contract 1.0.0 - master: Enterprise Sales Support Data Foundation Builder Agent docs/data_contract.md).
contract_version: "1.0.0"
top_k: 5
min_score: 0.0

# SDK QdrantVectorStore. Disabled keeps the documented "KB 未整備" zero-hit
# degradation. When enabled, every field below is required and invalid config
# aborts startup. This AG has no within-customer KB partitions; use one
# deployment-specific endpoint and the SDK namespace/agent isolation tag.
vector_store:
  enabled: false
  url: "http://qdrant:6333"
  product_collection_name: "product_kb"
  proposal_collection_name: "proposal_kb"
  namespace: "cmn"
  agent_name: "cmn_c2_257"
  vector_size: 1536
  distance: "cosine"
  timeout_s: 30
  write_timeout_s: 60
  max_batch_documents: 1000
  max_top_k: 100
  embedding_base_url: "https://api.openai.com/v1"
  embedding_model: "text-embedding-3-small"
  embedding_api_version: "2024-02-15-preview"
  embedding_provider: "openai"

# S-2 input size ceiling (chars) for hearing notes.
max_input_chars: 50000
